<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ติดต่อหอพัก</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7F3; --surface:#FFFFFF; --sunk:#F0F3EE; --line:#E2E7DF; --fg:#16271D; --muted:#56655B;
  --accent:#1D5B3B; --accent-ink:#FFFFFF; --accent-soft:#E6F0E8; --brass:#1D5B3B; --brass-soft:#EEF4EC;
  --room:#1D5B3B; --ok:#1F7A45; --ok-soft:#E3F3E8; --warn:#A86A00; --warn-soft:#FCF1DA; --crit:#C23A2B; --crit-soft:#FBE6E3;
  --shadow:0 18px 50px rgba(20,45,30,.18);
  --display:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body)}
.w{max-width:520px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0;line-height:1.25}h1{font-size:1.5rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}
p{margin:0}.m{color:var(--muted)}
.brandrow{display:flex;gap:12px;align-items:center}.brandrow img{width:52px;height:52px;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.addr{color:var(--muted);font-size:.95rem}
.ph{font-size:1.3rem;font-weight:700;user-select:all}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:12px;border-radius:12px;text-align:center;text-decoration:none;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.line{background:#06C755;border-color:#06C755;color:#fff}
.btn svg{width:20px;height:20px;flex:none}
.short{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="w" id="app"><p class="m">กำลังโหลด…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=window.supabase&&window.DORM_CONFIG&&!DORM_CONFIG.url.includes('YOUR-PROJECT')?supabase.createClient(DORM_CONFIG.url,DORM_CONFIG.anonKey):null;
const IC={tel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',map:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const lineUrl=l=>!l?'':/^https?:\/\//.test(l)?l:'https://line.me/R/ti/p/'+encodeURIComponent(l.startsWith('@')?l:'@'+l);
function place(name,addr,phone,line){return `<section class="card"><h2>${esc(name)}</h2>${addr?`<p class="addr">${esc(addr)}</p>`:''}${phone?`<p>โทร <span class="ph">${esc(phone)}</span></p>`:''}
  <div class="acts">${phone?`<a class="btn pri" href="tel:${esc(String(phone).replace(/[^0-9+]/g,''))}">${ic('tel')}โทรหาหอพัก</a>`:''}${line?`<a class="btn line" href="${esc(lineUrl(line))}">${ic('chat')}แชท LINE</a>`:''}${addr?`<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">${ic('map')}ดูแผนที่</a>`:''}</div></section>`}
(async()=>{let d=null;if(sb){const r=await sb.rpc('get_repair_setup');if(!r.error)d=r.data}
  if(!d){$('#app').innerHTML='<p class="m">ยังเปิดหน้าติดต่อไม่ได้ ลองใหม่อีกครั้ง</p>';return}
  const B=d.buildings||[],main=d.name||'หอพัก';
  const cards=B.length?B.map(b=>place(b.billName||b.name||main,b.address||d.address,b.phone||d.phone,d.line)).join(''):place(main,d.address,d.phone,d.line);
  $('#app').innerHTML=`<div class="brandrow"><img src="favicon-192.png" alt=""><div><h1>ติดต่อหอพัก</h1><p class="m">${esc(main)}</p></div></div>${cards}
  <div class="short"><a class="btn" href="bill.html">ดูบิล / จ่ายเงิน</a><a class="btn" href="repair.html">แจ้งซ่อม</a></div>`})();
</script></body></html>
